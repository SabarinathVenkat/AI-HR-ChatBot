<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMG Resume Builder - Ideas2IT</title>
  <meta name="theme-color" content="#0a1730">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="icon" href="/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/resume.css">
</head>
<body class="rb">
  <a class="skip-link" href="#view">Skip to the content</a>

  <header class="rb-head">
    <div class="rb-brand">
      <img class="brand-logo" src="/img/logo-white.svg" alt="" width="44" height="44">
      <h1><a class="rb-brand-link" href="/">Ideas2IT</a> / RMG Resume Builder</h1>
    </div>
    <nav id="tabs" class="rb-tabs" aria-label="Sections"></nav>
    <div class="rb-user">
      <button id="bell" class="btn rb-bell" type="button" aria-expanded="false" aria-controls="notes">Notifications <span id="bell-count" class="rb-count" hidden>0</span></button>
      <span id="who" class="who"></span>
      <a class="btn" href="/">All apps</a>
      <button id="sign-out" class="btn" type="button">Sign out</button>
    </div>
  </header>

  <section id="notes" class="rb-notes" hidden aria-label="Notifications">
    <div class="rb-notes-head"><h2>Notifications</h2><button id="notes-read" class="btn" type="button">Mark all read</button></div>
    <ul id="notes-list" class="rb-list"></ul>
  </section>

  <dialog id="jd-preview" class="rb-dialog" aria-labelledby="jd-preview-title">
    <div class="rb-dialog-head"><h2 id="jd-preview-title"></h2><button id="jd-preview-close" class="btn" type="button">Close</button></div>
    <div id="jd-preview-body" class="rb-dialog-body"></div>
  </dialog>

  <p id="message" class="rb-message" role="status" aria-live="polite" hidden></p>

  <main id="view" class="rb-main" tabindex="-1"></main>

  <script src="/resume.js"></script>
</body>
</html>
