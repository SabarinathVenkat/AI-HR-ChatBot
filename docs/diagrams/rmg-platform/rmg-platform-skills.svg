  <title id="rmg-platform-skills-title">The RMG skill library: one Skill for each task</title>
  <desc id="rmg-platform-skills-desc">The skill library: one Skill for the resume tailoring task is built today, two more tasks exist as app features and could become Skills, and three more are proposed; a task router picks the Skill for each task.</desc>
