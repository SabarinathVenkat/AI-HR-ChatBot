  <text x="640" y="624" fill="#0a1730" font-size="16" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">The app owns identity, workflow, data and enforcement. Skills own task know-how. A skill never touches the data directly.</text>
