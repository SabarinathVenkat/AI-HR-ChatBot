<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rmg-platform-overview-title rmg-platform-overview-desc">
  <title id="rmg-platform-overview-title">RMG platform: one app, one Skill per task</title>
  <desc id="rmg-platform-overview-desc">Architecture of the RMG platform: people use the app, which owns sign-in, workflow, data and enforcement; a task router picks one Skill per task from a skill library that runs in Claude's isolated sandbox; every result comes back through the app's guardrails and a person's approval, and a Skill can never reach the data directly.</desc>
