  <rect x="956" y="120" width="264" height="88" rx="6" fill="#f4f6fb"/><rect x="956" y="120" width="264" height="88" rx="6" fill="rgba(13,148,136,0.08)" stroke="#0d9488" stroke-width="1.2"/><rect x="964" y="126" width="78" height="12" rx="2" fill="transparent" stroke="#0d9488" stroke-opacity="0.5" stroke-width="0.8"/><text x="1003" y="135" fill="#0d9488" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 OF 6 BUILT</text><text x="1088" y="162" fill="#0a1730" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skill library</text><text x="1088" y="180" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">SKILL.md + scripts + templates</text><text x="1088" y="196" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one skill per RMG task</text>
  <rect x="956" y="264" width="264" height="88" rx="6" fill="#f4f6fb"/><rect x="956" y="264" width="264" height="88" rx="6" fill="rgba(10,23,48,0.02)" stroke="rgba(10,23,48,0.40)" stroke-width="1" stroke-dasharray="4,3"/><rect x="964" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(10,23,48,0.40)" stroke-opacity="0.5" stroke-width="0.8"/><text x="978" y="279" fill="rgba(10,23,48,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text><text x="1088" y="306" fill="#0a1730" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sandbox</text><text x="1088" y="324" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">no internet, no installs</text><text x="1088" y="340" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">files in, files out</text>
