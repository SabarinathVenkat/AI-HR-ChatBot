  <rect x="324" y="264" width="224" height="88" rx="6" fill="#f4f6fb"/><rect x="324" y="264" width="224" height="88" rx="6" fill="#ffffff" stroke="#0a1730" stroke-width="1"/><rect x="332" y="270" width="42" height="12" rx="2" fill="transparent" stroke="#0a1730" stroke-opacity="0.5" stroke-width="0.8"/><text x="353" y="279" fill="#0a1730" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILT</text><text x="436" y="306" fill="#0a1730" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human review</text><text x="436" y="324" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">8 approve or</text><text x="436" y="340" fill="#4a5a73" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">send back</text>
