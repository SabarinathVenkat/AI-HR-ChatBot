name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (errors, pyflakes, bugbear)
        run: ruff check .
      - name: Known-vulnerability audit of pinned dependencies
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models_cache
          key: bge-small-en-v1.5
      - name: Install the browser used by the UI tests
        run: playwright install --with-deps chromium
      - name: Unit, integration, retrieval-quality and browser tests (no API calls are made)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-audit, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t hr-chat-agent .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id hr-chat-agent -u)" != "0"

# The live evaluation (eval/run_eval.py) calls the Anthropic API and costs money, so it is run
# manually before a release rather than on every push. See docs/EVALUATION.md.
